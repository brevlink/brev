name: Audit dipendenze

# Il gate delle PR copre le sole dipendenze di produzione e si ferma a "high":
# le advisory della toolchain di build non devono bloccare ogni PR, perché quel
# codice non viene spedito (Dockerfile multi-stadio). Qui, una volta a settimana,
# si guarda tutto - sviluppo incluso - così quelle advisory non spariscono.
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [dashboard, landing]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
        working-directory: ${{ matrix.app }}
      - name: Audit completo (produzione e sviluppo)
        # Il report si produce prima di uscire con il codice di npm audit, così
        # la segnalazione può dire quali pacchetti sono coinvolti invece di
        # rimandare ai log del run.
        run: |
          set -euo pipefail
          status=0
          npm audit --audit-level=moderate --json > "$RUNNER_TEMP/audit.json" || status=$?
          node "$GITHUB_WORKSPACE/.github/scripts/audit-report.mjs" \
            "${{ matrix.app }}" "$RUNNER_TEMP/audit.json" > "$RUNNER_TEMP/report.md"
          cat "$RUNNER_TEMP/report.md" >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
        working-directory: ${{ matrix.app }}
      - name: Allega il report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: audit-${{ matrix.app }}
          path: ${{ runner.temp }}/report.md
          if-no-files-found: ignore

  report-failure:
    # La matrice termina tutta prima di creare/aggiornare una sola segnalazione.
    needs: audit
    if: always() && needs.audit.result == 'failure'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    # Serializza anche le esecuzioni manuali per evitare issue duplicate.
    concurrency:
      group: audit-dipendenze-issue
      cancel-in-progress: false
    steps:
      - name: Recupera i report
        uses: actions/download-artifact@v5
        with:
          pattern: audit-*
          path: reports
      - name: Segnala il fallimento dell'audit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          title='Audit dipendenze: intervento richiesto'
          marker='<!-- brev-audit-dipendenze -->'
          body_file="$RUNNER_TEMP/body.md"
          {
            printf '%s\n\n' "$marker"
            printf 'Audit completo fallito (produzione e sviluppo, soglia moderate).\n\n'
            if compgen -G "reports/*/report.md" > /dev/null; then
              for report in reports/*/report.md; do
                cat "$report"
                printf '\n'
              done
            else
              printf 'Nessun report prodotto: installazione o audit non eseguibile, vedere i log del run.\n\n'
            fi
            printf 'Run: %s\n' "$RUN_URL"
          } > "$body_file"
          # Usa l'API senza indice di ricerca: una issue appena creata è subito visibile.
          issues=$(gh api --paginate "repos/$GH_REPO/issues?state=all&per_page=100" \
            --jq '.[] | select(.pull_request == null) | select((.body // "") | startswith("<!-- brev-audit-dipendenze -->")) | [.number, .state] | @tsv')
          existing=$(printf '%s\n' "$issues" | head -n 1)
          if [[ -n "$existing" ]]; then
            read -r number state <<< "$existing"
            if [[ "$state" == 'closed' ]]; then
              gh issue reopen "$number"
            fi
            gh issue comment "$number" --body-file "$body_file"
          else
            gh issue create --title "$title" --body-file "$body_file"
          fi

  report-success:
    # Chiusura esplicita: senza questo la issue resterebbe aperta anche dopo che
    # le dipendenze sono state sistemate, e la si chiuderebbe a mano ogni volta.
    needs: audit
    if: always() && needs.audit.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    concurrency:
      group: audit-dipendenze-issue
      cancel-in-progress: false
    steps:
      - name: Chiudi la segnalazione se l'audit è tornato pulito
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          issues=$(gh api --paginate "repos/$GH_REPO/issues?state=open&per_page=100" \
            --jq '.[] | select(.pull_request == null) | select((.body // "") | startswith("<!-- brev-audit-dipendenze -->")) | .number')
          for number in $issues; do
            gh issue comment "$number" --body "Audit completo tornato pulito (produzione e sviluppo, soglia moderate): chiudo la segnalazione, la prossima esecuzione la riapre se ricompare qualcosa.

          Run: $RUN_URL"
            gh issue close "$number"
          done
