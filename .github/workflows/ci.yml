name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  security-events: write

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements-dev.txt bandit pip-audit
      - name: Test backend
        run: pytest backend/tests -q
      - name: Verify Alembic migration
        env:
          DATABASE_URL: sqlite+aiosqlite:////tmp/brev-alembic-ci.db
          JWT_SECRET: 12345678901234567890123456789012
          DEBUG: "false"
        run: alembic -c backend/alembic.ini upgrade head
      - name: Audit Python dependencies
        run: pip-audit -r backend/requirements.txt
      - name: Static security scan
        run: bandit -r backend/app -q

  frontend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [dashboard, landing]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: ${{ matrix.app }}
      - name: Audit production dependencies
        # Le PR non devono bloccarsi sulle advisory della toolchain di build, che
        # non viene mai spedita (Dockerfile multi-stadio). Qui si ferma a "high".
        # Il controllo completo, sviluppo incluso, gira a parte una volta a
        # settimana: vedi .github/workflows/audit-dipendenze.yml
        run: npm audit --omit=dev --audit-level=high
        working-directory: ${{ matrix.app }}
      - name: Check legal pages and privacy-sensitive assets
        if: matrix.app == 'landing'
        run: npm run check:legal
        working-directory: ${{ matrix.app }}
      - name: Build
        run: npm run build
        working-directory: ${{ matrix.app }}
