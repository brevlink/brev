name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  security-events: write

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements-dev.txt bandit pip-audit
      - name: Test backend
        run: pytest backend/tests -q
      - name: Verify Alembic migration
        env:
          DATABASE_URL: sqlite+aiosqlite:////tmp/brev-alembic-ci.db
          JWT_SECRET: 12345678901234567890123456789012
          DEBUG: "false"
        run: alembic -c backend/alembic.ini upgrade head
      - name: Audit Python dependencies
        run: pip-audit -r backend/requirements.txt
      - name: Static security scan
        run: bandit -r backend/app -q

  frontend:
    name: frontend (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [dashboard, landing]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: ${{ matrix.app }}
      - name: Audit production dependencies
        # Le PR non devono bloccarsi sulle advisory della toolchain di build, che
        # non viene mai spedita (Dockerfile multi-stadio). Qui si ferma a "high".
        # Il controllo completo, sviluppo incluso, gira a parte una volta a
        # settimana: vedi .github/workflows/audit-dipendenze.yml
        run: npm audit --omit=dev --audit-level=high
        working-directory: ${{ matrix.app }}
      - name: Check legal pages and privacy-sensitive assets
        if: matrix.app == 'landing'
        run: npm run check:legal
        working-directory: ${{ matrix.app }}
      - name: Build
        run: npm run build
        working-directory: ${{ matrix.app }}

  deploy-changes:
    # Il confronto copre tutto il push, anche quando contiene più commit.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.changes.outputs.backend }}
      dashboard: ${{ steps.changes.outputs.dashboard }}
      landing: ${{ steps.changes.outputs.landing }}
      caddy: ${{ steps.changes.outputs.caddy }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Individua i deploy necessari
        id: changes
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: bash .github/scripts/deploy-changes.sh "$BEFORE" "$AFTER" >> "$GITHUB_OUTPUT"

  deploy-backend:
    # needs include entrambi i gate: un test rosso impedisce la pubblicazione.
    needs: [backend, frontend, deploy-changes]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.deploy-changes.outputs.backend == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/deploy-backend.yml

  deploy-dashboard:
    # needs include entrambi i gate: un test rosso impedisce la pubblicazione.
    needs: [backend, frontend, deploy-changes]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.deploy-changes.outputs.dashboard == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/deploy-dashboard.yml

  deploy-landing:
    # needs include entrambi i gate: un test rosso impedisce la pubblicazione.
    needs: [backend, frontend, deploy-changes]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.deploy-changes.outputs.landing == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/deploy-landing.yml

  deploy-caddy:
    # needs include entrambi i gate: un test rosso impedisce la pubblicazione.
    needs: [backend, frontend, deploy-changes]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.deploy-changes.outputs.caddy == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/deploy-caddy.yml
